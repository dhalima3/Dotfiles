- defaults:
    link:
      relink: true

- create:
    - ~/.config
    - ~/.config/ghostty

- link:
    ~/.dotfiles: ''
    ~/.config/nvim: nvim
    ~/.ideavimrc: ideavimrc
    ~/.fonts: fonts
    ~/.zsh: zsh
    ~/.zshrc: zshrc
    ~/.p10k.zsh: p10k.zsh
    ~/.gitconfig: gitconfig
    ~/.gitignore: gitignore
    ~/.aerospace.toml: aerospace.toml
    ~/.config/ghostty/config: ghostty/config
    ~/.config/karabiner: karabiner
