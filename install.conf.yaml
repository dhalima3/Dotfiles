- defaults:
    link:
      relink: true

- clean: ['~']

- link:
    ~/.dotfiles: ''
    ~/.config/nvim: nvim
    ~/.ideavimrc: ideavimrc
    ~/.fonts: fonts
    ~/.zsh: zsh
    ~/.zshrc: zshrc
    ~/.p10k.zsh: p10k.zsh
    ~/.gitconfig: gitconfig
    ~/.gitignore: gitignore
    ~/.aerospace.toml: aerospace.toml
    ~/.config/karabiner/karabiner.json: karabiner/karabiner.json
