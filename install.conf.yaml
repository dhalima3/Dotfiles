- defaults:
    link:
      relink: true

- clean: ['~']

- link:
    ~/.dotfiles: ''
    ~/.vim: vim
    ~/.vimrc: vimrc
    ~/.ideavimrc: ideavimrc
    ~/.fonts: fonts
    ~/.zsh: zsh
    ~/.zshrc: zshrc
    ~/.gitconfig: gitconfig
    ~/.gitignore: gitignore
    ~/.aerospace.toml: aerospace.toml
    ~/.config/karabiner/karabiner.json: karabiner/karabiner.json

- shell:
  - [git submodule update --init --recursive, Installing submodules]
